# Alokasi memori untuk proses Gradle.
# Diturunkan dari 8G agar tidak membuat sistem kehabisan RAM, yang sebelumnya
# menyebabkan Kotlin daemon mati di tengah proses build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Mengompilasi Kotlin di dalam proses Gradle, bukan di daemon terpisah.
# Inilah kunci perbaikan error "Connection to the Kotlin daemon has been
# unexpectedly lost".
kotlin.compiler.execution.strategy=in-process

# Menonaktifkan build paralel agar pemakaian memori lebih hemat.
org.gradle.parallel=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Menonaktifkan kompilasi bertahap Kotlin.
# Cache bertahap disimpan di folder build/ dan sering terkunci oleh antivirus
# di Windows, yang memunculkan error "Could not close incremental caches".
kotlin.incremental=false
org.gradle.caching=false