name: nugasmana
description: "Aplikasi rekomendasi tempat nugas untuk mahasiswa di Kota Malang."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Menyimpan daftar favorit dan sesi login di perangkat
  shared_preferences: ^2.2.2

  # Membuka lokasi cafe di aplikasi Google Maps
  url_launcher: ^6.2.5

  # Dipakai pada tahap pengembangan berikutnya (integrasi API)
  http: ^1.2.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/cafes.json
